<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F8F9FA">
  <meta name="description" content="Gestioná indumentaria y calzado">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Moda Stock">
  <meta property="og:description" content="Gestioná indumentaria y calzado">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Moda Stock">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Moda Stock">
  <meta name="twitter:description" content="Gestioná indumentaria y calzado">
  <meta name="twitter:image" content="/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moda Stock">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moda Stock</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F8F9FA;
    }
    #flutter-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    flt-platform-view img {
      pointer-events: none !important;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-splash .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #1E1E1E;
    }
    #app-splash .brand span {
      color: #C45C3E;
    }
    #app-splash .spinner {
      width: 28px;
      height: 28px;
      margin-top: 24px;
      border: 2.4px solid #F3E4DE;
      border-top-color: #C45C3E;
      border-radius: 50%;
      animation: app-spin 0.7s linear infinite;
    }
    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="brand">Moda <span>Stock</span></div>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <div id="flutter-app"></div>
  <script>
    (function () {
      var lastHeight = 0;
      function viewportHeight() {
        var visual = window.visualViewport && window.visualViewport.height;
        var inner = window.innerHeight || 0;
        var client = document.documentElement.clientHeight || 0;
        return Math.max(visual || 0, inner, client);
      }
      function syncViewportHeight() {
        var next = viewportHeight();
        if (next > lastHeight + 0.5) {
          lastHeight = next;
          document.documentElement.style.height = next + 'px';
          return true;
        }
        return false;
      }
      function notifyFlutterViewport(force) {
        var changed = syncViewportHeight();
        if (changed || force) {
          window.dispatchEvent(new Event('resize'));
        }
      }
      function hideAppSplash() {
        var el = document.getElementById('app-splash');
        if (el) el.remove();
      }
      syncViewportHeight();
      window.addEventListener('load', function () {
        notifyFlutterViewport(true);
      });
      window.addEventListener('pageshow', function () {
        notifyFlutterViewport(true);
      });
      window.addEventListener('orientationchange', function () {
        lastHeight = 0;
        setTimeout(function () {
          notifyFlutterViewport(true);
        }, 250);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          notifyFlutterViewport(false);
        });
      }
      window.addEventListener('flutter-first-frame', function () {
        hideAppSplash();
        notifyFlutterViewport(true);
        [50, 150, 400, 800].forEach(function (ms) {
          setTimeout(function () {
            notifyFlutterViewport(true);
          }, ms);
        });
      });
      setTimeout(hideAppSplash, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
