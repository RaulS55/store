<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moda Stock</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #F8F9FA;
    }
    #flutter-app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    flt-platform-view img {
      pointer-events: none !important;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-splash .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #1E1E1E;
    }
    #app-splash .brand span {
      color: #C45C3E;
    }
    #app-splash .spinner {
      width: 28px;
      height: 28px;
      margin-top: 24px;
      border: 2.4px solid #F3E4DE;
      border-top-color: #C45C3E;
      border-radius: 50%;
      animation: app-spin 0.7s linear infinite;
    }
    @keyframes app-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash">
    <div class="brand">Moda <span>Stock</span></div>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <div id="flutter-app"></div>
  <script>
    (function () {
      var app = document.getElementById('flutter-app');
      var fullHeight = 0;

      function hideAppSplash() {
        var el = document.getElementById('app-splash');
        if (el) el.remove();
      }

      function isEditing() {
        var el = document.activeElement;
        if (!el) return false;
        var tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable === true;
      }

      function visualHeight() {
        var viewport = window.visualViewport;
        return viewport && viewport.height ? viewport.height : 0;
      }

      function layoutHeight() {
        return Math.round(Math.max(window.innerHeight || 0, visualHeight()));
      }

      // The keyboard OK/Done button often leaves the visual viewport short and
      // scrolled. Remember the height from before it opened and put it back.
      function targetHeight() {
        var visual = visualHeight();
        var full = layoutHeight();
        var keyboard = isEditing() && fullHeight > 0 && (fullHeight - (visual || full)) > 80;
        if (keyboard) return Math.round(visual || full);
        if (!full) return fullHeight;
        if (!fullHeight || full >= fullHeight - 80) {
          fullHeight = full;
          return full;
        }
        return fullHeight;
      }

      function applyViewport() {
        var next = targetHeight();
        if (!next) return;
        var px = next + 'px';
        document.documentElement.style.height = px;
        document.body.style.height = px;
        if (app) {
          app.style.height = px;
          app.style.top = '0px';
        }
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
      }

      function restoreAfterKeyboard() {
        [0, 50, 150, 350, 700].forEach(function (ms) {
          setTimeout(function () {
            if (!isEditing()) applyViewport();
          }, ms);
        });
      }

      applyViewport();
      window.addEventListener('load', applyViewport);
      window.addEventListener('pageshow', applyViewport);
      window.addEventListener('resize', applyViewport);
      window.addEventListener('orientationchange', function () {
        fullHeight = 0;
        setTimeout(applyViewport, 250);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyViewport);
        window.visualViewport.addEventListener('scroll', applyViewport);
      }
      document.addEventListener('focusout', restoreAfterKeyboard);
      window.addEventListener('flutter-first-frame', function () {
        hideAppSplash();
        restoreAfterKeyboard();
      });
      setTimeout(hideAppSplash, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
